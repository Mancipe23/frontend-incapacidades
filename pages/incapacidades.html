<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Incapacidades</title>

<link rel="stylesheet"
      href="../css/styles.css">

</head>

<body>

<div class="page-container">

    <h1>Incapacidades</h1>

    <h2>Registrar Incapacidad</h2>

    <input
        type="number"
        id="empleado_id"
        placeholder="ID Empleado">

    <br><br>

    <input
        type="date"
        id="fecha_inicio">

    <br><br>

    <input
        type="date"
        id="fecha_fin">

    <br><br>

    <label>Tipo de incapacidad:</label>

    <br><br>

    <select id="tipo">

        <option value="enfermedad_general">
            Enfermedad General
        </option>

        <option value="accidente_laboral">
            Accidente Laboral
        </option>

        <option value="licencia_medica">
            Licencia Médica
        </option>

        <option value="incapacidad_temporal">
            Incapacidad Temporal
        </option>

    </select>

    <br><br>

    <input
        type="text"
        id="diagnostico_general"
        placeholder="Diagnóstico General">

    <br><br>

    <input
        type="text"
        id="entidad_medica"
        placeholder="Entidad Médica">

    <br><br>

    <textarea
        id="observaciones"
        placeholder="Observaciones"></textarea>

    <br><br>

    <button onclick="registrarIncapacidad()">
        Registrar Incapacidad
    </button>

    <br><br>

    <h2>Historial de Incapacidades</h2>

    <table border="1" width="100%">

        <thead>

            <tr>
                <th>ID</th>
                <th>Empleado</th>
                <th>Tipo</th>
                <th>Inicio</th>
                <th>Fin</th>
                <th>Días</th>
                <th>Estado</th>
            </tr>

        </thead>

        <tbody id="tablaIncapacidades">

        </tbody>

    </table>

    <br><br>

    <button onclick="window.location.href='dashboard.html'">
        Volver
    </button>

</div>

<script src="../js/incapacidades.js"></script>

</body>

</html>

<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Incapacidades</title>

<link rel="stylesheet"
      href="../css/styles.css">

</head>

<body>

<div class="page-container">

    <h1>Incapacidades</h1>

    <h2>Registrar Incapacidad</h2>

    <input type="number"
           id="empleado_id"
           placeholder="ID Empleado">

    <input type="date"
           id="fecha_inicio">

    <input type="date"
           id="fecha_fin">

    <input type="text"
           id="tipo"
           placeholder="Tipo">

    <input type="text"
           id="diagnostico_general"
           placeholder="Diagnóstico">

    <input type="text"
           id="entidad_medica"
           placeholder="Entidad Médica">

    <input type="text"
           id="observaciones"
           placeholder="Observaciones">

    <button onclick="registrarIncapacidad()">
        Registrar Incapacidad
    </button>

    <br><br>

    <table border="1" width="100%">

        <thead>

            <tr>
                <th>ID</th>
                <th>Empleado</th>
                <th>Tipo</th>
                <th>Inicio</th>
                <th>Fin</th>
                <th>Días</th>
                <th>Estado</th>
            </tr>

        </thead>

        <tbody id="tablaIncapacidades">

        </tbody>

    </table>

    <br>

    <button onclick="window.location.href='dashboard.html'">
        Volver
    </button>

</div>

<script src="../js/incapacidades.js"></script>

</body>

</html>

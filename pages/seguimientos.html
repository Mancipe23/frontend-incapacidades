<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<title>Seguimientos</title>

<link rel="stylesheet"
      href="../css/styles.css">

</head>

<body>

<div class="page-container">

    <h1>Seguimientos</h1>

    <h2>Registrar Seguimiento</h2>

    <input type="number"
           id="incapacidad_id"
           placeholder="ID Incapacidad">

    <input type="date"
           id="fecha">

    <input type="text"
           id="comentario"
           placeholder="Comentario">

    <input type="text"
           id="estado"
           placeholder="Estado">

    <input type="text"
           id="usuario_responsable"
           placeholder="Responsable">

    <button onclick="registrarSeguimiento()">
        Registrar Seguimiento
    </button>

    <br><br>

    <table border="1">

        <thead>

            <tr>

                <th>ID</th>
                <th>Incapacidad</th>
                <th>Fecha</th>
                <th>Comentario</th>
                <th>Estado</th>
                <th>Responsable</th>

            </tr>

        </thead>

        <tbody id="tablaSeguimientos">

        </tbody>

    </table>

    <br>

    <button onclick="window.location.href='dashboard.html'">
        Volver
    </button>

</div>

<script src="../js/seguimientos.js"></script>

</body>

</html>

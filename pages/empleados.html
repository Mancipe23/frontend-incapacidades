<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Empleados</title>

<link rel="stylesheet"
      href="../css/styles.css">

</head>

<body>

<div class="page-container">

    <h1>Empleados</h1>

    <h2>Registrar Empleado</h2>

    <input type="text"
           id="nombres"
           placeholder="Nombres">

    <input type="text"
           id="apellidos"
           placeholder="Apellidos">

    <input type="text"
           id="documento"
           placeholder="Documento">

    <input type="email"
           id="correo"
           placeholder="Correo">

    <input type="text"
           id="telefono"
           placeholder="Teléfono">

    <input type="text"
           id="cargo"
           placeholder="Cargo">

    <input type="text"
           id="area"
           placeholder="Área">

    <input type="date"
           id="fecha_ingreso">

    <button onclick="registrarEmpleado()">
        Registrar Empleado
    </button>

    <br><br>

    <table border="1" width="100%">

        <thead>

            <tr>
                <th>ID</th>
                <th>Nombres</th>
                <th>Apellidos</th>
                <th>Cargo</th>
                <th>Área</th>
            </tr>

        </thead>

        <tbody id="tablaEmpleados">

        </tbody>

    </table>

    <br>

    <button onclick="window.location.href='dashboard.html'">
        Volver
    </button>

</div>

<script src="../js/empleados.js"></script>

</body>

</html>
